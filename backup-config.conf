# Git Repository Backup Configuration

# Source directory containing git repositories
SOURCE_PATH="/path/to/git/repos"

# Destination directory for backups
BACKUP_PATH="/path/to/backups"

# Number of backup copies to keep
KEEP_COPIES=7

# Number of recent backups to keep uncompressed (for fast restoration)
# Older backups will be compressed to .tar.gz to save space
# Set to 0 to disable compression
KEEP_UNCOMPRESSED=2

# Backup interval in hours (for reference/documentation)
# Actual scheduling is done via cron
BACKUP_INTERVAL_HOURS=24
